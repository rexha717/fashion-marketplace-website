<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Fashion Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'GFS Didot', Didot, 'Bodoni MT', 'Times New Roman', serif; font-style: italic; background: linear-gradient(to bottom, #000000, #4a0e1f); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .scratch-wine { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.7; mix-blend-mode: normal; }
        .card { position: relative; z-index: 1; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 300px; }
        h2 { text-align: center; font-family: Arial, sans-serif; font-style: normal; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'GFS Didot', Didot, 'Bodoni MT', 'Times New Roman', serif; }
        button { width: 100%; padding: 10px; background: #000000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-family: 'GFS Didot', Didot, 'Bodoni MT', 'Times New Roman', serif; }
        button:hover { background: #1a1a1a; }
        p { text-align: center; font-size: 14px; }
        a { font-family: 'GFS Didot', Didot, 'Bodoni MT', 'Times New Roman', serif; }
    </style>
</head>
<body>
    <canvas id="scratch-wine" class="scratch-wine"></canvas>
    <div class="card">
        <h2>Sign Up</h2>
        {% if errors %}
        <p style="color: red;">
            {% for field, msgs in errors.items %}{% for m in msgs %}{{ m }} {% endfor %}{% endfor %}
        </p>
        {% endif %}
        <form method="post" action="/accounts/signup/">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Create Account</button>
        </form>
        <p>Already have an account? <a href="/accounts/signin/">Sign In</a></p>
    </div>
        <script>
    (function () {
        var canvas = document.getElementById('scratch-wine');
        if (!canvas) { return; }
        var ctx = canvas.getContext('2d');
        var srcData = null, srcW = 0, srcH = 0;
        var work = null, wctx = null, wimg = null;
        var workW = 0, workH = 0;
        var vw = 0, vh = 0, offsetY = 0;

        function extract(img, offset) {
            var dpr = window.devicePixelRatio || 1;
            vw = window.innerWidth;
            vh = window.innerHeight;
            canvas.width = Math.round(vw * dpr);
            canvas.height = Math.round(vh * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            var off = document.createElement('canvas');
            off.width = img.width;
            off.height = img.height;
            var g = off.getContext('2d');
            g.drawImage(img, 0, 0);
            var d = g.getImageData(0, 0, off.width, off.height);
            var px = d.data;
            for (var i = 0; i < px.length; i += 4) {
                var lum = 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
                if (lum > 235) { px[i + 3] = 0; } else {
                    var a = 255 - lum;
                    px[i] = 0; px[i + 1] = 0; px[i + 2] = 0;
                    px[i + 3] = Math.round(a * 0.85);
                }
            }
            g.putImageData(d, 0, 0);
            srcW = off.width; srcH = off.height;
            srcData = g.getImageData(0, 0, srcW, srcH).data;
            offsetY = offset;
            setupWork();
        }

        function setupWork() {
            workW = Math.max(120, Math.round(vw));
            workH = Math.max(80, Math.round(vh));
            work = document.createElement('canvas');
            work.width = workW; work.height = workH;
            wctx = work.getContext('2d');
            wimg = wctx.createImageData(workW, workH);
        }

        function frame() {
            if (!srcData) { return; }
            var dx = 0;
            var scaleX = vw / (srcH - 1), scaleY = vh / (srcW - 1);
            var buf = wimg.data;
            for (var y = 0; y < workH; y++) {
                var screenY = y * (vh / workH) + offsetY;
                var row = y * workW;
                for (var x = 0; x < workW; x++) {
                    var screenX = x * (vw / workW) + dx;
                    var idx = (row + x) << 2;
                    var r = screenX / scaleX;
                    if (r < 0 || r >= srcH) { buf[idx + 3] = 0; continue; }
                    var c = (vh - screenY) / scaleY;
                    if (c < 0 || c >= srcW) { buf[idx + 3] = 0; continue; }
                    var si = (Math.round(r) * srcW + Math.round(c)) << 2;
                    var alpha = srcData[si + 3];
                    buf[idx] = srcData[si];
                    buf[idx + 1] = srcData[si + 1];
                    buf[idx + 2] = srcData[si + 2];
                    buf[idx + 3] = alpha;
                }
            }
            wctx.putImageData(wimg, 0, 0);
            ctx.clearRect(0, 0, vw, vh);
            ctx.drawImage(work, 0, 0, vw, vh);
        }

        img.onload = function () {
            extract(img, Math.round(vh * 0.06));
            frame();
        };
